name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: stable
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173  # v4
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@311b4ee155dcdab395044f00946f664bd51ff173  # v4
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173  # v4
