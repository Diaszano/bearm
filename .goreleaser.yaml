version: 2

project_name: bearm

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bearm
    main: ./cmd/bearm
    binary: bearm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/Diaszano/bearm/internal/buildinfo.version={{.Version}}
        -X github.com/Diaszano/bearm/internal/buildinfo.commit={{.Commit}}
        -X github.com/Diaszano/bearm/internal/buildinfo.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
