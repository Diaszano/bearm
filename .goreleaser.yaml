version: 2

project_name: bearm

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bearm
    main: ./cmd/bearm
    binary: bearm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/Diaszano/bearm/internal/buildinfo.version={{.Version}}
        -X github.com/Diaszano/bearm/internal/buildinfo.commit={{.Commit}}
        -X github.com/Diaszano/bearm/internal/buildinfo.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md
      - man/bearm.1

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  prerelease: auto

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

homebrew_casks:
  - name: bearm
    repository:
      owner: Diaszano
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Diaszano/bearm"
    description: "Safe native replacement for Unix rm with restore support"
    license: "MIT"
    binaries:
      - bearm
    manpages:
      - man/bearm.1

changelog:
  use: github-native
